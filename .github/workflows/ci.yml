# Continuous integration.
#
#   test   every push and pull request: ruff + pytest (unit, contract on DuckDB, AppTest).
#          Needs no credentials: the suite runs entirely against the local DuckDB backend.
#
# Deployment is not automated here. `databricks bundle deploy` needs a workspace, so wire
# it up in your own fork with your own credentials (docs/DEPLOYMENT.md).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      # Playwright screenshot tests are on-demand (DESIGN.md §9) and need browsers; they are
      # expected to skip when no browser is installed. The Databricks contract tests run only
      # with RDM_TEST_DATABRICKS=1 and workspace credentials (docs/DEPLOYMENT.md §7).
      - name: Pytest
        run: python -m pytest

      - name: Scan for content that must not be published
        run: python scripts/scan_public_safe.py --root .
