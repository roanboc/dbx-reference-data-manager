# Databricks Asset Bundle for the Reference Data Manager.
#
# Declares everything the app needs in a workspace: the Unity Catalog catalog
# (resources/catalog.yml), the function schemas with their grants (resources/schemas.yml)
# and the Databricks App itself (resources/app.yml). See docs/DEPLOYMENT.md for the
# workflow.
#
# Nothing here is filled in for you. Every value that depends on your workspace is a
# variable with a placeholder default; set them in the `dev` target below, or pass
# --var="name=value" / export BUNDLE_VAR_<name>, before the first deploy. A placeholder
# left unchanged makes the deploy fail loudly rather than deploy into the wrong place.
#
#   databricks bundle validate -t dev --profile <your CLI profile>
#   databricks bundle deploy   -t dev --profile <your CLI profile>
#   databricks bundle run reference_data_manager -t dev --profile <your CLI profile>
#
# None of this is needed to try the app: `make seed && make run` runs it locally on
# DuckDB with no Databricks account at all.

bundle:
  name: dbx-reference-data-manager
  databricks_cli_version: ">= 1.3.0"

include:
  - resources/*.yml

variables:
  catalog:
    description: >-
      Unity Catalog catalog that holds the functions (schemas), forms (tables) and files
      (volumes). Created by resources/catalog.yml; the app reads it as RDM_CATALOG.
      Keep the leading underscore or drop it, but keep app.yaml in step.
    default: _reference_data

  warehouse_id:
    description: >-
      ID of the SQL warehouse the app queries; serverless is recommended (DESIGN.md §10).
      List yours with `databricks warehouses list`.
    default: <your-warehouse-id>

  storage_root:
    description: >-
      Managed storage location of the catalog, needed only when your metastore has no
      default storage root; otherwise delete the storage_root line in
      resources/catalog.yml. Azure looks like
      abfss://<container>@<storage-account>.dfs.core.windows.net/<path>, AWS like
      s3://<bucket>/<path>.
    default: <your-storage-root-or-remove-it>

  admin_group:
    description: >-
      Account-level group of global administrators: creates functions (CREATE_SCHEMA),
      manages grants (MANAGE) and manages the app (CAN_MANAGE). Must be an account group;
      workspace-local groups are not accepted by Unity Catalog grants.
    default: <your-admin-group>

  breakglass_group:
    description: >-
      Second account group with the same privileges as admin_group, so the catalog is
      never left without an administrator. Set it to the same value as admin_group if you
      do not run a separate break-glass group.
    default: <your-breakglass-group>

  app_name:
    description: >-
      Name of the Databricks App. Lowercase letters, digits and hyphens only; must be
      unique in the workspace (apps are NOT prefixed per developer in development mode).
    default: reference-data-manager

  app_users_group:
    description: >-
      Group that may open the app (CAN_USE on the app). What a user can then see or edit
      is decided only by the Unity Catalog grants on the schemas.
    default: users

  auth_mode:
    description: >-
      Identity provider of the app: `databricks` (X-Forwarded-* headers, production) or
      `mock` (switchable review personas; only meaningful together with debug_personas,
      on a deployment that holds test data).
    default: databricks

  debug_personas:
    description: >-
      "true" lets reviewers switch between the Global admin / Function admin / Editor /
      Viewer personas with simulated roles. Queries then run as the app's service
      principal, so enable it only on a deployment with test data - never in production.
    default: "false"

targets:
  # One example target. Copy it for each environment you run (dev, test, prd) and give
  # each its own workspace host and catalog name.
  #
  # `mode: development` is deliberately not set: its schema name prefix (dev_<name>_)
  # would rename the registry schema, which the app resolves by the fixed name _catalog,
  # and hang every grant on the wrong schemas. Isolate environments with distinct catalog
  # names instead. Two people deploying into the same workspace need distinct
  # --var="catalog=..." and --var="app_name=..." values.
  dev:
    default: true
    workspace:
      host: https://<your-workspace-host>.cloud.databricks.com
    variables:
      catalog: _reference_data
      app_name: reference-data-manager
      warehouse_id: <your-warehouse-id>
      storage_root: <your-storage-root-or-remove-it>
      # Uncomment both to review the four roles without an identity provider, on test data only.
      # The app's service principal then needs the admin privilege set on the catalog,
      # because every query runs as it rather than as the signed-in user.
      # auth_mode: mock
      # debug_personas: "true"
