# Function schemas of the reference-data catalog. The app's hierarchy is
# domain > function > form | file: one schema per business *function*, named <domain>__<area>
# (lowercase, matches the app's identifier rule ^[a-z][a-z0-9_]{0,62}$), grouped into
# business *domains* (a classifier the app keeps in _catalog.domains and records on the
# schema as the property rdm.domain / tag rdm_domain). Each function's files
# live in the managed volume <schema>._files, created by the app on first use (CREATE_VOLUME).
#
# Role mapping (docs/DESIGN.md §5) - grants go to account-level groups, never to users:
#   Viewer          USE_SCHEMA, SELECT, READ_VOLUME            (+ USE_CATALOG from catalog.yml)
#   Editor          Viewer + MODIFY + WRITE_VOLUME             (replace files)
#   Function admin  Editor + CREATE_TABLE + CREATE_VOLUME + MANAGE + APPLY_TAG
#   Global admin    CREATE_SCHEMA + MANAGE on the catalog (resources/catalog.yml); only
#                   global admins delete functions and forms and maintain the domain list
#
# The catalog administrators group already inherits the Function admin set from the catalog
# (resources/catalog.yml); it is repeated on every schema so each function is self-describing
# and keeps working if the catalog grants are tightened. To delegate administration of one
# function, add a function-specific group with the same privilege list.
#
# Notes
#   * `properties` carry the display name, owner and domain the app shows in the sidebar
#     (rdm.display_name / rdm.owner / rdm.domain, see rdm.models). The domain name must exist
#     in the app's domain list (Domains page, global admins); a schema without rdm.domain
#     shows under "Unassigned" until a global admin assigns it. The app additionally sets
#     schema tags (rdm_display_name, rdm_owner, rdm_domain) for functions it creates itself;
#     the bundle schema resource has no tags field, so tags for these schemas can be added
#     later in Catalog Explorer.
#   * Do not run a target with `mode: development`: the CLI would prefix each schema name
#     with dev_<your-short-name>_, renaming the registry schema the app resolves by its
#     fixed name _catalog. Isolate environments with distinct catalog names instead.
#   * Grants are managed as the complete grant list of each schema (see catalog.yml).
#   * Delete a function by removing its block here (the CLI destroys the schema on the next
#     deploy) - only after its tables have been migrated or dropped. The app's own "Delete
#     function" (global admins) refuses while tables exist.
resources:
  schemas:
    # System schema used by the app: registry (domains, functions, forms) and the
    # row-level audit trail (change_log). Every app user writes audit rows, so editors need
    # MODIFY here; the tables are created by the app on first use (CREATE TABLE IF NOT EXISTS).
    rdm_catalog:
      name: _catalog
      catalog_name: ${resources.catalogs.forms.name}
      comment: "Reference Data Manager registry and audit trail (managed by the app)"
      grants:
        # Unity Catalog grants only accept account-level principals; the workspace-local
        # `users` group (var.app_users_group, used for the app permission) is not one.
        - principal: account users
          privileges: [USE_SCHEMA, SELECT, READ_VOLUME, MODIFY, WRITE_VOLUME]
        - principal: ${var.admin_group}
          privileges: [USE_SCHEMA, SELECT, MODIFY, CREATE_TABLE, MANAGE]
        - principal: ${var.breakglass_group}
          privileges: [USE_SCHEMA, SELECT, MODIFY, CREATE_TABLE, MANAGE]

    # Example function. Copy this block for each function you want the bundle to own,
    # or delete it and let global admins create functions in the app instead.
    # <domain>__<area>; the properties are what the app reads back as the function's
    # display name, owner and domain.
    example_function:
      name: finance__cost_management
      catalog_name: ${resources.catalogs.forms.name}
      comment: Reference lists maintained by the Finance team.
      properties:
        rdm.display_name: "Finance - Cost Management"
        rdm.owner: <owner-group-or-address>
        rdm.domain: finance
      grants:
        - principal: ${var.admin_group}       # Global admin group (Function admin set)
          privileges: [USE_SCHEMA, SELECT, READ_VOLUME, MODIFY, WRITE_VOLUME, CREATE_TABLE, CREATE_VOLUME, MANAGE, APPLY_TAG]
        - principal: ${var.breakglass_group}
          privileges: [USE_SCHEMA, SELECT, READ_VOLUME, MODIFY, WRITE_VOLUME, CREATE_TABLE, CREATE_VOLUME, MANAGE, APPLY_TAG]
        # Add the function's own groups here, e.g.
        # - principal: <your-editor-group>
        #   privileges: [USE_SCHEMA, SELECT, READ_VOLUME, MODIFY, WRITE_VOLUME]
        # - principal: <your-viewer-group>
        #   privileges: [USE_SCHEMA, SELECT, READ_VOLUME]

