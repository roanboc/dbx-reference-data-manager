# Unity Catalog catalog that holds every reference-data domain (schema) and form (table).
#
# Ownership: the identity that runs `databricks bundle deploy` becomes the owner of the
# catalog (in prod: the run_as service principal). The bundle resource has no `owner`
# field; transfer ownership with `ALTER CATALOG ... OWNER TO ...` only if you also give
# the deploying identity MANAGE, otherwise later deploys cannot manage the grants.
#
# Grants declared here are managed as the complete grant list of the securable: privileges
# granted elsewhere (Catalog Explorer, SQL GRANT, the app's own "grant role" action) are
# reverted on the next deploy. Declare every group here or in resources/schemas.yml.
resources:
  catalogs:
    forms:
      name: ${var.catalog}
      comment: >-
        Reference Data Manager: reference lists and slowly changing lookup tables managed by
        data stewards through the Reference Data Manager app. One schema per business function
        (<domain>__<area>, grouped into business domains), one Delta table per form and a
        _files volume per function for CSV/Parquet datasets. Governance is Unity Catalog grants
        on the schemas; the app only decides what to render.
      # Only needed when your metastore has no default storage root; delete this line
      # otherwise, and leave the storage_root variable at its placeholder.
      storage_root: ${var.storage_root}

      # A catalog is visible to every workspace of the metastore until it is isolated.
      # The bundle schema has no isolation field, so if you want to restrict the catalog to
      # named workspaces, set the isolation mode and the bindings with two CLI calls after
      # the first deploy (docs/DEPLOYMENT.md, "Restricting the catalog to its workspaces");
      # they persist over redeploys.

      grants:
        # Global administrators (design §5): USE_CATALOG + CREATE_SCHEMA to create functions,
        # MANAGE to grant roles, and the full Function admin set which schemas inherit so that
        # global admins can create, alter, delete and edit every form in every function. Explicit privileges are
        # preferred over ALL_PRIVILEGES so the list is reviewable; swap in ALL_PRIVILEGES if
        # your policy prefers it.
        - principal: ${var.admin_group}
          privileges:
            - USE_CATALOG
            - BROWSE
            - CREATE_SCHEMA
            - USE_SCHEMA
            - SELECT
            - MODIFY
            - CREATE_TABLE
            - CREATE_VOLUME
            - READ_VOLUME
            - WRITE_VOLUME
            - MANAGE
            - APPLY_TAG

        - principal: ${var.breakglass_group}
          privileges:
            - USE_CATALOG
            - BROWSE
            - CREATE_SCHEMA
            - USE_SCHEMA
            - SELECT
            - MODIFY
            - CREATE_TABLE
            - CREATE_VOLUME
            - READ_VOLUME
            - WRITE_VOLUME
            - MANAGE
            - APPLY_TAG

        # Every account user may *use* and *discover* the catalog. USE_CATALOG on its own
        # reveals nothing but the catalog name, and BROWSE (FR-44) lets everyone find the
        # catalog and read object metadata in Catalog Explorer / Discover like other domain
        # catalogs: without USE_SCHEMA + SELECT on a schema (resources/schemas.yml) a
        # user sees no functions and no data. Granting it once here means a new function group only
        # needs schema-level grants (the Viewer role = USE_CATALOG + USE_SCHEMA + SELECT).
        # If your policy forbids catalog-wide USE_CATALOG, replace this with one entry per
        # function group (readers, stewards) instead.
        - principal: account users
          privileges:
            - USE_CATALOG
            - BROWSE
